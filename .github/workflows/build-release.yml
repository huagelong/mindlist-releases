name: Build and publish MindList

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in the private MindList repository (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: mindlist-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.3"
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_REPOSITORY: huagelong/mindlist
  RELEASE_REPOSITORY: huagelong/mindlist-releases

jobs:
  verify:
    name: Verify source and version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      asset_suffix: ${{ steps.version.outputs.asset_suffix }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.tag }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          fallback_version_name="${raw_version%%+*}"
          fallback_build_number="${raw_version##*+}"
          if [[ -z "$fallback_version_name" || "$fallback_build_number" == "$raw_version" || ! "$fallback_build_number" =~ ^[0-9]+$ ]]; then
            echo "pubspec.yaml version must use major.minor.patch+build" >&2
            exit 1
          fi
          tag="$RELEASE_TAG"
          version_name="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must use vmajor.minor.patch.' >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Private source tag $tag does not exist." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Release tags must point to a commit on main.' >&2
            exit 1
          fi
          if [[ "$fallback_version_name" != "$version_name" ]]; then
            echo "pubspec.yaml version $fallback_version_name does not match release tag $tag" >&2
            exit 1
          fi
          # This repository has its own run counter; start above existing Android version codes.
          build_number="$((2000 + GITHUB_RUN_NUMBER))"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vmajor.minor.patch, for example v1.0.6" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "asset_suffix=$version_name-$build_number" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Validate local release configuration
        shell: bash
        run: |
          set -euo pipefail
          dart tool/validate_release_config.dart "$RELEASE_TAG"
      - run: flutter analyze
      - run: flutter test

  create_release:
    name: Create GitHub Release draft
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create release draft if missing
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          release_repo="$RELEASE_REPOSITORY"
          if gh release view "$tag" --repo "$release_repo" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --repo "$release_repo" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "Release ${tag} is already public; refusing to replace its assets." >&2
              exit 1
            fi
            if ! gh api "repos/$release_repo/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Release ${tag} exists without a git tag (orphaned draft)." >&2
              echo "Delete it at https://github.com/$release_repo/releases then re-run." >&2
              exit 1
            fi
            echo "Release ${tag} is an existing draft; uploads require each asset name to be unused."
            exit 0
          fi
          # 草稿必须挂在真实存在的 git tag 上，否则会变成 untagged 孤儿草稿，
          # 资产可以上传但按 id 发布（PATCH）会返回 404
          if ! gh api "repos/$release_repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            master_sha="$(gh api "repos/$release_repo/git/ref/heads/master" --jq '.object.sha')"
            gh api --method POST "repos/$release_repo/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$master_sha" >/dev/null
          fi
          if ! gh release create "$tag" \
            --repo "$release_repo" \
            --target master \
            --draft \
            --title "MindList ${{ needs.verify.outputs.version_name }}" \
            --notes 'MindList ${{ needs.verify.outputs.version_name }} is now available for Windows, Linux, Android, and macOS.'; then
            # 并发运行时另一个 run 可能已抢先创建，release 存在即可继续
            gh release view "$tag" --repo "$release_repo" >/dev/null 2>&1
          fi
          if [[ "$(gh release view "$tag" --repo "$release_repo" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "Release ${tag} is not a draft; refusing to upload assets." >&2
            exit 1
          fi

  android:
    name: Android signed APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force || true
          df -h
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Validate Android signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret or variable: $name" >&2
              exit 1
            fi
          done
      - name: Restore Android keystore
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mindlist-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mindlist-release.jks" >> "$GITHUB_ENV"
      - name: Constrain Gradle memory for the hosted runner
        shell: bash
        run: |
          # 仓库里的 android/gradle.properties 为本地开发留了 8G 堆，托管 runner
          # 内存更小，JVM 一路吃满内存时构建会被外部信号终止（退出码 143）。
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            'kotlin.daemon.jvmargs=-Xmx2g' \
            'org.gradle.caching=true' \
            > "$HOME/.gradle/gradle.properties"
      - run: flutter pub get
      - run: >-
          flutter build apk --release --split-per-abi
          --build-name "${{ needs.verify.outputs.version_name }}"
          --build-number "${{ needs.verify.outputs.build_number }}"
      - name: Upload Sentry symbols
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ needs.verify.outputs.version_name }}
          SENTRY_DIST: ${{ needs.verify.outputs.build_number }}
        run: |
          set -euo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN:-}" || -z "${SENTRY_ORG:-}" || -z "${SENTRY_PROJECT:-}" ]]; then
            echo "Sentry credentials not configured; skipping symbol upload." >&2
            exit 0
          fi
          dart run sentry_dart_plugin
      - name: Prepare Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/MindList-android-arm64-v8a-${{ needs.verify.outputs.asset_suffix }}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/MindList-android-armeabi-v7a-${{ needs.verify.outputs.asset_suffix }}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/MindList-android-x86_64-${{ needs.verify.outputs.asset_suffix }}.apk"
      - name: Verify Android APK signatures
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" || ! -d "$ANDROID_HOME/build-tools" ]]; then
            echo "Android build-tools not found under ANDROID_HOME='${ANDROID_HOME:-}'." >&2
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          if [[ ! -x "$apksigner" ]]; then
            echo "apksigner not found in $ANDROID_HOME/build-tools." >&2
            exit 1
          fi
          echo "==> Using apksigner: $apksigner"
          for apk in \
            "dist/MindList-android-arm64-v8a-${{ needs.verify.outputs.asset_suffix }}.apk" \
            "dist/MindList-android-armeabi-v7a-${{ needs.verify.outputs.asset_suffix }}.apk" \
            "dist/MindList-android-x86_64-${{ needs.verify.outputs.asset_suffix }}.apk"; do
            echo "==> Verifying signature: $apk"
            "$apksigner" verify --verbose --print-certs "$apk"
          done
      - name: Upload APK to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          for attempt in $(seq 1 60); do
            state="$(gh release view "$tag" --repo "$RELEASE_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [[ "$state" == "true" ]]; then
              break
            fi
            if [[ "$state" == "false" ]]; then
              echo "Release ${tag} is already public; refusing to upload assets." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "GitHub Release ${tag} was not created in time" >&2
              exit 1
            fi
            sleep 5
          done
          gh release upload "$tag" \
            "dist/MindList-android-arm64-v8a-${{ needs.verify.outputs.asset_suffix }}.apk" \
            "dist/MindList-android-armeabi-v7a-${{ needs.verify.outputs.asset_suffix }}.apk" \
            "dist/MindList-android-x86_64-${{ needs.verify.outputs.asset_suffix }}.apk" \
            --repo "$RELEASE_REPOSITORY"

  windows:
    name: Windows ${{ matrix.arch }} installer and ZIP
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            installer_arch: x64compatible
          - arch: arm64
            runner: windows-11-arm
            installer_arch: arm64
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter SDK for Windows ARM64
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $flutterRoot
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone Flutter SDK.' }
          $env:PROCESSOR_ARCHITECTURE = 'ARM64'
          & (Join-Path $flutterRoot 'bin\flutter.bat') --version
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize Flutter SDK.' }
          ./tool/verify_windows_bundle.ps1 -Bundle (Join-Path $flutterRoot 'bin\cache\dart-sdk\bin') -Architecture arm64
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $flutterRoot 'bin')
      - run: flutter pub get
      - run: >-
          flutter build windows --release
          --build-name "${{ needs.verify.outputs.version_name }}"
          --build-number "${{ needs.verify.outputs.build_number }}"
      - name: Install ARM64 voice libraries
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sherpa-onnx-arm64.tar.bz2'
          Invoke-WebRequest `
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.6/sherpa-onnx-v1.13.6-win-arm64-shared-MD-Release-lib.tar.bz2' `
            -OutFile $archive
          $expected = '38d5ae2e4d0f467dbd1bf3c0fbdb9d969f47f434288c82e4a76c751c0b353cf7'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'ARM64 voice library archive checksum mismatch.'
          }
          $extract = Join-Path $env:RUNNER_TEMP 'sherpa-onnx-arm64'
          python -c "import tarfile,sys; tarfile.open(sys.argv[1]).extractall(sys.argv[2])" $archive $extract
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract ARM64 voice libraries.' }
          $source = Join-Path $extract 'sherpa-onnx-v1.13.6-win-arm64-shared-MD-Release-lib\lib'
          $bundle = 'build\windows\arm64\runner\Release'
          Copy-Item "$source\onnxruntime.dll", "$source\sherpa-onnx-c-api.dll" -Destination $bundle -Force
      - name: Verify Windows binary architecture
        shell: pwsh
        run: ./tool/verify_windows_bundle.ps1 -Bundle "build\windows\${{ matrix.arch }}\runner\Release" -Architecture '${{ matrix.arch }}'
      - name: Upload Sentry symbols
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ needs.verify.outputs.version_name }}
          SENTRY_DIST: ${{ needs.verify.outputs.build_number }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SENTRY_AUTH_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:SENTRY_ORG) -or
              [string]::IsNullOrWhiteSpace($env:SENTRY_PROJECT)) {
            Write-Host 'Sentry credentials not configured; skipping symbol upload.'
            exit 0
          }
          dart run sentry_dart_plugin
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Create Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw 'Inno Setup compiler was not installed.'
          }
          & $iscc `
            "/DAppVersion=${{ needs.verify.outputs.version_name }}" `
            "/DSourceDir=$pwd\build\windows\${{ matrix.arch }}\runner\Release" `
            "/DOutputDir=$pwd\dist" `
            "/DOutputBaseFilename=MindList-windows-${{ needs.verify.outputs.asset_suffix }}-${{ matrix.arch }}-setup" `
            "/DAppArchitecture=${{ matrix.installer_arch }}" `
            'windows\installer\mindlist.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          $bundle = "build\windows\${{ matrix.arch }}\runner\Release"
          if (-not (Test-Path -LiteralPath "$bundle\mindlist.exe")) {
            throw "Windows ${{ matrix.arch }} build is missing mindlist.exe."
          }
          Compress-Archive -Path "$bundle\*" `
            -DestinationPath "dist\MindList-windows-${{ needs.verify.outputs.asset_suffix }}-${{ matrix.arch }}-portable.zip"
      - name: Upload Windows packages to GitHub Release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $state = gh release view $tag --repo $env:RELEASE_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
            if ($LASTEXITCODE -eq 0) {
              if ($state -ne 'true') {
                throw "Release $tag is already public; refusing to upload assets."
              }
              break
            }
            if ($attempt -eq 60) {
              throw "GitHub Release $tag was not created in time."
            }
            Start-Sleep -Seconds 5
          }
          gh release upload $tag `
            "dist\MindList-windows-${{ needs.verify.outputs.asset_suffix }}-${{ matrix.arch }}-setup.exe" `
            "dist\MindList-windows-${{ needs.verify.outputs.asset_suffix }}-${{ matrix.arch }}-portable.zip" `
            --repo $env:RELEASE_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload failed with exit code $LASTEXITCODE."
          }

  macos:
    name: macOS ad-hoc signed ${{ matrix.arch }} ZIP
    needs: verify
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: x64
            mach_arch: x86_64
            excluded_arch: arm64
          - arch: arm64
            mach_arch: arm64
            excluded_arch: x86_64
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Select macOS architecture
        shell: bash
        run: |
          echo 'EXCLUDED_ARCHS = ${{ matrix.excluded_arch }}' >> macos/Runner/Configs/Release.xcconfig
      - run: flutter pub get
      - run: >-
          flutter build macos --release
          --build-name "${{ needs.verify.outputs.version_name }}"
          --build-number "${{ needs.verify.outputs.build_number }}"
      - name: Verify signature and package macOS app
        shell: bash
        run: |
          set -euo pipefail
          app='build/macos/Build/Products/Release/MindList.app'
          test -d "$app"
          test "$(lipo -archs "$app/Contents/MacOS/MindList")" = '${{ matrix.mach_arch }}'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -F 'Signature=adhoc'
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/MindList-macos-${{ needs.verify.outputs.asset_suffix }}-${{ matrix.arch }}.zip"
      - name: Upload macOS ZIP to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          for attempt in $(seq 1 60); do
            state="$(gh release view "$tag" --repo "$RELEASE_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [[ "$state" == "true" ]]; then
              break
            fi
            if [[ "$state" == "false" ]]; then
              echo "Release ${tag} is already public; refusing to upload assets." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "GitHub Release ${tag} was not created in time" >&2
              exit 1
            fi
            sleep 5
          done
          gh release upload "$tag" \
            "dist/MindList-macos-${{ needs.verify.outputs.asset_suffix }}-${{ matrix.arch }}.zip" \
            --repo "$RELEASE_REPOSITORY"

  ios_compile:
    name: Verify iOS App Store build (unsigned)
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Select Xcode 26 for iOS SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Compile iOS with subscription products
        run: >-
          flutter build ios --release --no-codesign
          --build-name "${{ needs.verify.outputs.version_name }}"
          --build-number "${{ needs.verify.outputs.build_number }}"
      - run: test -d build/ios/iphoneos/Runner.app

  linux:
    name: Linux AppImage
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            openjdk-17-jdk \
            libkeybinder-3.0-dev \
            liblzma-dev \
            libsecret-1-dev \
            ninja-build \
            pkg-config \
            rpm
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: >-
          flutter build linux --release
          --build-name "${{ needs.verify.outputs.version_name }}"
          --build-number "${{ needs.verify.outputs.build_number }}"
      - name: Create Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin dist
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png build/mindlist.png
          curl --fail --location --output linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --output linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="$PWD/dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-x86_64.AppImage"
          export PATH="$PWD:$PATH"
          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/mindlist \
            --desktop-file linux/packaging/com.devinghub.mindlist.desktop \
            --icon-file build/mindlist.png \
            --output appimage
          test -f "$OUTPUT"
      - name: Create Linux amd64 DEB
        shell: bash
        run: |
          bash tool/package_linux_deb.sh \
            build/linux/x64/release/bundle amd64 \
            "${{ needs.verify.outputs.version_name }}-${{ needs.verify.outputs.build_number }}" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-amd64.deb"
      - name: Create Linux x86_64 RPM
        shell: bash
        run: |
          bash tool/package_linux_rpm.sh \
            build/linux/x64/release/bundle x86_64 \
            "${{ needs.verify.outputs.version_name }}-${{ needs.verify.outputs.build_number }}" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-x86_64.rpm"
      - name: Upload Linux x64 packages to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          for attempt in $(seq 1 60); do
            state="$(gh release view "$tag" --repo "$RELEASE_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [[ "$state" == "true" ]]; then
              break
            fi
            if [[ "$state" == "false" ]]; then
              echo "Release ${tag} is already public; refusing to upload assets." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "GitHub Release ${tag} was not created in time" >&2
              exit 1
            fi
            sleep 5
          done
          gh release upload "$tag" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-x86_64.AppImage" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-amd64.deb" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-x86_64.rpm" \
            --repo "$RELEASE_REPOSITORY"

  linux_arm64:
    name: Linux arm64 DEB and RPM
    needs: verify
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            binutils clang cmake libayatana-appindicator3-dev libcurl4-openssl-dev \
            libgtk-3-dev openjdk-17-jdk libkeybinder-3.0-dev liblzma-dev \
            libsecret-1-dev ninja-build pkg-config rpm
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" >> "$GITHUB_ENV"
      - name: Install Flutter SDK for Linux ARM64
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get
      - run: >-
          flutter build linux --release --target-platform linux-arm64
          --build-name "${{ needs.verify.outputs.version_name }}"
          --build-number "${{ needs.verify.outputs.build_number }}"
      - name: Install ARM64 ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/onnxruntime-linux-aarch64-1.15.1.tgz"
          curl --fail --location --output "$archive" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.15.1/onnxruntime-linux-aarch64-1.15.1.tgz
          echo "85272e75d8dd841138de4b774a9672ea93c1be108d96038c6c34a62d7f976aee  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/onnxruntime-linux-aarch64-1.15.1/lib/libonnxruntime.so.1.15.1" \
            build/linux/arm64/release/bundle/lib/libonnxruntime.so.1.15.1
      - name: Use system xclip for Linux ARM64 clipboard
        run: |
          install -m 755 linux/packaging/xclip-wrapper.sh \
            build/linux/arm64/release/bundle/data/flutter_assets/packages/quill_native_bridge_linux/assets/xclip
      - name: Create Linux arm64 DEB
        shell: bash
        run: |
          bash tool/package_linux_deb.sh \
            build/linux/arm64/release/bundle arm64 \
            "${{ needs.verify.outputs.version_name }}-${{ needs.verify.outputs.build_number }}" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-arm64.deb"
      - name: Create Linux aarch64 RPM
        shell: bash
        run: |
          bash tool/package_linux_rpm.sh \
            build/linux/arm64/release/bundle aarch64 \
            "${{ needs.verify.outputs.version_name }}-${{ needs.verify.outputs.build_number }}" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-aarch64.rpm"
      - name: Upload Linux arm64 packages to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          for attempt in $(seq 1 60); do
            state="$(gh release view "$tag" --repo "$RELEASE_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [[ "$state" == "true" ]]; then
              break
            fi
            if [[ "$state" == "false" ]]; then
              echo "Release ${tag} is already public; refusing to upload assets." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "GitHub Release ${tag} was not created in time" >&2
              exit 1
            fi
            sleep 5
          done
          gh release upload "$tag" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-arm64.deb" \
            "dist/MindList-linux-${{ needs.verify.outputs.asset_suffix }}-aarch64.rpm" \
            --repo "$RELEASE_REPOSITORY"

  linux_legacy:
    name: Linux legacy AppImage (glibc 2.31)
    needs: verify
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      GH_CLI_VERSION: "2.63.2"
      SQLITE_VERSION_NAME: "3.53.4"
      SQLITE_AMALGAMATION_VERSION: "3530400"
      SQLITE_AMALGAMATION_SHA256: 1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install Ubuntu 20.04 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils \
            ca-certificates \
            clang \
            cmake \
            curl \
            file \
            git \
            jq \
            libayatana-appindicator3-dev \
            libayatana-ido3-dev \
            libayatana-indicator3-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            liblzma-dev \
            libsecret-1-dev \
            libwebp-dev \
            ninja-build \
            openjdk-17-jdk \
            pkg-config \
            unzip \
            xz-utils
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Trust mounted Flutter SDK
        shell: bash
        run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get
      - run: >-
          flutter build linux --release
          --build-name "${{ needs.verify.outputs.version_name }}"
          --build-number "${{ needs.verify.outputs.build_number }}"
      - name: Compile legacy-compatible SQLite
        shell: bash
        run: |
          set -euo pipefail
          sqlite_directory="$PWD/build/sqlite-legacy"
          sqlite_archive="$sqlite_directory/sqlite-amalgamation.zip"
          mkdir -p "$sqlite_directory"
          curl --fail --location --output "$sqlite_archive" \
            "https://www.sqlite.org/2026/sqlite-amalgamation-${SQLITE_AMALGAMATION_VERSION}.zip"
          echo "$SQLITE_AMALGAMATION_SHA256  $sqlite_archive" | sha256sum --check --strict
          unzip -q "$sqlite_archive" -d "$sqlite_directory"
          clang -O2 -fPIC -shared \
            "$sqlite_directory/sqlite-amalgamation-${SQLITE_AMALGAMATION_VERSION}/sqlite3.c" \
            -o "$sqlite_directory/libsqlite3.so" \
            -Wl,-Bsymbolic \
            -DSQLITE_ENABLE_DBSTAT_VTAB \
            -DSQLITE_ENABLE_FTS5 \
            -DSQLITE_ENABLE_RTREE \
            -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -DSQLITE_DQS=0 \
            -DSQLITE_DEFAULT_MEMSTATUS=0 \
            -DSQLITE_TEMP_STORE=2 \
            -DSQLITE_MAX_EXPR_DEPTH=0 \
            -DSQLITE_STRICT_SUBTYPE=1 \
            -DSQLITE_OMIT_AUTHORIZATION \
            -DSQLITE_OMIT_DECLTYPE \
            -DSQLITE_OMIT_DEPRECATED \
            -DSQLITE_OMIT_PROGRESS_CALLBACK \
            -DSQLITE_OMIT_SHARED_CACHE \
            -DSQLITE_OMIT_TCL_VARIABLE \
            -DSQLITE_OMIT_TRACE \
            -DSQLITE_USE_ALLOCA \
            -DSQLITE_ENABLE_SESSION \
            -DSQLITE_ENABLE_PREUPDATE_HOOK \
            -DSQLITE_UNTESTABLE \
            -DSQLITE_HAVE_ISNAN \
            -DSQLITE_HAVE_LOCALTIME_R \
            -DSQLITE_HAVE_MALLOC_USABLE_SIZE \
            -DSQLITE_HAVE_STRCHRNUL \
            -ldl -lm -lpthread
          test -f "$sqlite_directory/libsqlite3.so"
          strings "$sqlite_directory/libsqlite3.so" | grep --fixed-strings --line-regexp "$SQLITE_VERSION_NAME"
      - name: Create Linux legacy AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin dist
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp build/sqlite-legacy/libsqlite3.so AppDir/usr/bin/lib/libsqlite3.so
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png build/mindlist.png
          curl --fail --location --output linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --output linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="$PWD/dist/MindList-linux-legacy-${{ needs.verify.outputs.asset_suffix }}-x86_64.AppImage"
          export PATH="$PWD:$PATH"
          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/mindlist \
            --desktop-file linux/packaging/com.devinghub.mindlist.desktop \
            --icon-file build/mindlist.png \
            --output appimage
          test -f "$OUTPUT"
      - name: Verify legacy glibc baseline
        shell: bash
        run: |
          set -euo pipefail
          app_image="$PWD/dist/MindList-linux-legacy-${{ needs.verify.outputs.asset_suffix }}-x86_64.AppImage"
          scan_directory="$(mktemp -d)"
          cd "$scan_directory"
          "$app_image" --appimage-extract >/dev/null
          strings squashfs-root/usr/bin/lib/libsqlite3.so | grep --fixed-strings --line-regexp "$SQLITE_VERSION_NAME"
          max_glibc="$({
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep --quiet 'ELF'; then
                readelf --version-info "$candidate" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' || true
              fi
            done < <(find squashfs-root -type f -print0)
          } | sort --version-sort | tail -n 1)"
          max_glibcxx="$({
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep --quiet 'ELF'; then
                readelf --version-info "$candidate" 2>/dev/null | grep -o 'GLIBCXX_[0-9.]*' || true
              fi
            done < <(find squashfs-root -type f -print0)
          } | sort --version-sort | tail -n 1)"
          if [[ -z "$max_glibc" || -z "$max_glibcxx" ]]; then
            echo 'No GLIBC or GLIBCXX requirements found in legacy AppImage.' >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$max_glibc" GLIBC_2.31 | sort --version-sort | tail -n 1)" != 'GLIBC_2.31' ]]; then
            echo "Legacy AppImage requires $max_glibc, newer than GLIBC_2.31." >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$max_glibcxx" GLIBCXX_3.4.28 | sort --version-sort | tail -n 1)" != 'GLIBCXX_3.4.28' ]]; then
            echo "Legacy AppImage requires $max_glibcxx, newer than GLIBCXX_3.4.28." >&2
            exit 1
          fi
          echo "Legacy AppImage maximum requirements: $max_glibc, $max_glibcxx"
      - name: Upload legacy AppImage to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          export PATH="/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin:$PATH"
          gh --version
          tag="${RELEASE_TAG}"
          for attempt in $(seq 1 60); do
            state="$(gh release view "$tag" --repo "$RELEASE_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [[ "$state" == "true" ]]; then
              break
            fi
            if [[ "$state" == "false" ]]; then
              echo "Release ${tag} is already public; refusing to upload assets." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "GitHub Release ${tag} was not created in time" >&2
              exit 1
            fi
            sleep 5
          done
          gh release upload "$tag" \
            "dist/MindList-linux-legacy-${{ needs.verify.outputs.asset_suffix }}-x86_64.AppImage" \
            --repo "$RELEASE_REPOSITORY"

  publish:
    name: Publish public release metadata
    needs: [verify, create_release, android, windows, macos, ios_compile, linux, linux_arm64, linux_legacy]
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.verify.outputs.source_sha }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.RELEASE_REPOSITORY }}
          ref: master
          path: release-repository
      - name: Verify and download release assets
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $assetNames = @(
            'MindList-android-arm64-v8a-${{ needs.verify.outputs.asset_suffix }}.apk',
            'MindList-android-armeabi-v7a-${{ needs.verify.outputs.asset_suffix }}.apk',
            'MindList-android-x86_64-${{ needs.verify.outputs.asset_suffix }}.apk',
            'MindList-windows-${{ needs.verify.outputs.asset_suffix }}-x64-setup.exe',
            'MindList-windows-${{ needs.verify.outputs.asset_suffix }}-x64-portable.zip',
            'MindList-windows-${{ needs.verify.outputs.asset_suffix }}-arm64-setup.exe',
            'MindList-windows-${{ needs.verify.outputs.asset_suffix }}-arm64-portable.zip',
            'MindList-macos-${{ needs.verify.outputs.asset_suffix }}-x64.zip',
            'MindList-macos-${{ needs.verify.outputs.asset_suffix }}-arm64.zip',
            'MindList-linux-${{ needs.verify.outputs.asset_suffix }}-x86_64.AppImage',
            'MindList-linux-${{ needs.verify.outputs.asset_suffix }}-amd64.deb',
            'MindList-linux-${{ needs.verify.outputs.asset_suffix }}-arm64.deb',
            'MindList-linux-${{ needs.verify.outputs.asset_suffix }}-x86_64.rpm',
            'MindList-linux-${{ needs.verify.outputs.asset_suffix }}-aarch64.rpm',
            'MindList-linux-legacy-${{ needs.verify.outputs.asset_suffix }}-x86_64.AppImage'
          )
          $releaseJson = gh release view $tag --repo $env:RELEASE_REPOSITORY --json isDraft,assets
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release $tag does not exist."
          }
          $release = $releaseJson | ConvertFrom-Json
          $uploadedNames = @($release.assets | ForEach-Object { $_.name })
          $missingAssets = @($assetNames | Where-Object { $uploadedNames -notcontains $_ })
          if ($missingAssets.Count -gt 0) {
            throw "GitHub Release $tag is missing assets: $($missingAssets -join ', ')"
          }
          if (-not $release.isDraft) {
            throw "Release $tag is already public."
          }
          foreach ($assetName in $assetNames) {
            gh release download $tag --repo $env:RELEASE_REPOSITORY --dir artifacts --pattern $assetName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download release asset $assetName."
            }
          }
      - name: Generate stable update metadata
        shell: pwsh
        run: |
          ./tool/prepare_release_metadata.ps1 `
            -ReleaseDirectory artifacts `
            -SiteDirectory release-repository/site `
            -Tag $env:RELEASE_TAG `
            -VersionName '${{ needs.verify.outputs.version_name }}' `
            -BuildNumber ${{ needs.verify.outputs.build_number }} `
            -ReleaseNotes 'MindList ${{ needs.verify.outputs.version_name }} is now available for Windows, Linux, Android, and macOS.'
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to publish GitHub Release.'
          }
      - name: Publish update metadata
        shell: pwsh
        working-directory: release-repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all -- site
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "release: publish $env:RELEASE_TAG metadata"
            git push origin master
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect generated release metadata.'
          }
      - name: Deploy updated Pages site
        shell: pwsh
        run: |
          gh workflow run pages.yml --repo $env:RELEASE_REPOSITORY --ref master
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to trigger GitHub Pages deployment.'
          }
      - name: Remove downloaded release files
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath artifacts -Recurse -Force -ErrorAction SilentlyContinue
