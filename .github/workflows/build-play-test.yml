name: Build Google Play internal test bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag on the private MindList main branch
        required: true
        default: v1.6.22
        type: string
      play_low_product_id:
        description: Base monthly subscription ID (leave both IDs empty before products exist)
        required: false
        type: string
      play_high_product_id:
        description: Premium monthly subscription ID (leave both IDs empty before products exist)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mindlist-play-test-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PLAY_LOW_PRODUCT_ID: ${{ inputs.play_low_product_id }}
      PLAY_HIGH_PRODUCT_ID: ${{ inputs.play_high_product_id }}
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift || true
          sudo docker image prune --all --force || true
      - uses: actions/checkout@v5
        with:
          repository: huagelong/mindlist
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.MINDLIST_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
      - name: Validate source and product IDs
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a vX.Y.Z tag from the private source repository.' >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" ||
             [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]] ||
             ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'The tag must point to a commit on the private main branch.' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          source_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          if [[ "${source_version%%+*}" != "$version" ]]; then
            echo 'The tag and pubspec.yaml versions differ.' >&2
            exit 1
          fi
          if [[ -n "$PLAY_LOW_PRODUCT_ID" || -n "$PLAY_HIGH_PRODUCT_ID" ]]; then
            if [[ -z "$PLAY_LOW_PRODUCT_ID" || -z "$PLAY_HIGH_PRODUCT_ID" ||
                  "$PLAY_LOW_PRODUCT_ID" == "$PLAY_HIGH_PRODUCT_ID" ]]; then
              echo 'Provide two distinct Google Play product IDs.' >&2
              exit 1
            fi
            for id in "$PLAY_LOW_PRODUCT_ID" "$PLAY_HIGH_PRODUCT_ID"; do
              if [[ ! "$id" =~ ^[a-z][a-z0-9_.]*$ ]]; then
                echo 'Product IDs must contain lowercase letters, digits, underscores or dots.' >&2
                exit 1
              fi
            done
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$((5000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - name: Validate signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub secret or variable: $name" >&2
              exit 1
            fi
          done
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mindlist-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mindlist-release.jks" >> "$GITHUB_ENV"
      - name: Constrain Gradle memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            'kotlin.daemon.jvmargs=-Xmx2g' 'org.gradle.caching=true' \
            > "$HOME/.gradle/gradle.properties"
      - run: flutter pub get
      - name: Build signed staging bundle
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name '${{ steps.version.outputs.version }}' \
            --build-number '${{ steps.version.outputs.build_number }}' \
            --dart-define=MINDLIST_SERVER_URL=https://mindlist-staging.devinghub.com \
            "--dart-define=MINDLIST_PLAY_LOW_PRODUCT_ID=$PLAY_LOW_PRODUCT_ID" \
            "--dart-define=MINDLIST_PLAY_HIGH_PRODUCT_ID=$PLAY_HIGH_PRODUCT_ID"
      - name: Verify and name bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          jarsigner -verify "$bundle" | grep -F 'jar verified.'
          unzip -Z -1 "$bundle" | grep -Fx 'base/manifest/AndroidManifest.xml'
          mkdir -p dist
          cp "$bundle" "dist/MindList-play-staging-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: MindList-play-staging-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 7
